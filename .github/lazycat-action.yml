version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: mirobody

build:
  toolchains: []
  run_buildscript: false

images:
  - id: mirobody
    target: service
    service: mirobody
    source: docker.io/thetahealth4mirobody/mirobody
    channel: stable
    sort: semver
    tag_regex: '^[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true
  - id: pg
    target: service
    service: pg
    source: docker.io/pgvector/pgvector
    channel: stable
    sort: semver
    tag_regex: '^0\.8\.6-pg17-trixie$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Mirobody
    summary: 自托管健康记录：化验单、可穿戴设备与基因数据汇成一份完整档案，指标标准化（LOINC）且可溯源，内置 AI 助手与 MCP 服务器。
