package: community.lazycat.app.mirobody
version: 1.6.1
name: Mirobody
description: "Mirror your body in data: a self-hosted health record built from lab reports, wearables and genetics, with every number traced to its source and a built-in MCP server. Run with your own LLM API key (Apache-2.0)."
min_os_version: 1.5.0
homepage: https://github.com/thetahealth/mirobody
author: thetahealth
license: Apache-2.0
locales:
  zh:
    name: "Mirobody"
    description: "你的健康数字分身：自托管健康记录，汇聚体检报告、穿戴设备与基因数据，每个数值可追溯到来源，内置 MCP 服务。需自备一个 LLM API Key（Apache-2.0）。"
  zh_CN:
    name: "Mirobody"
    description: "你的健康数字分身：自托管健康记录，汇聚体检报告、穿戴设备与基因数据，每个数值可追溯到来源，内置 MCP 服务。需自备一个 LLM API Key（Apache-2.0）。"
  en:
    name: "Mirobody"
    description: "Mirror your body in data: a self-hosted health record built from lab reports, wearables and genetics, with every number traced to its source and a built-in MCP server. Run with your own LLM API key (Apache-2.0)."
permissions:
  required:
    - net.internet
manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
